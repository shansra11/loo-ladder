<style>
/* Layout: one narrow column like a tiled bathroom wall — header, ladder of letter tiles, keyboard pinned below. */
:root{
  --bg:#e8f0f1; --grout:#d6e2e4; --tile:#ffffff; --tile-edge:#c9d7da;
  --fg:#17312f; --muted:#5d7472; --accent:#1d7470; --accent-fg:#ffffff;
  --goal:#8b5a2b; --goal-fg:#fff8ef; --warn:#b3392f; --key:#dbe6e8; --key-fg:#17312f;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f191a; --grout:#16231f; --tile:#1b2b2d; --tile-edge:#29403f;
  --fg:#e3eeec; --muted:#93aaa7; --accent:#3fb3aa; --accent-fg:#06201e;
  --goal:#b47a42; --goal-fg:#1a0f05; --warn:#ef7b70; --key:#223537; --key-fg:#e3eeec; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f191a; --grout:#16231f; --tile:#1b2b2d; --tile-edge:#29403f;
  --fg:#e3eeec; --muted:#93aaa7; --accent:#3fb3aa; --accent-fg:#06201e;
  --goal:#b47a42; --goal-fg:#1a0f05; --warn:#ef7b70; --key:#223537; --key-fg:#e3eeec; color-scheme:dark}
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;height:100%}
[hidden]{display:none!important}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.kb,.controls,.modes{-webkit-user-select:none;user-select:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow button{flex:1;height:44px}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
  background-image:linear-gradient(var(--grout) 2px,transparent 2px),linear-gradient(90deg,var(--grout) 2px,transparent 2px);
  background-size:56px 56px;}
.app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 12px;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;letter-spacing:.5px;line-height:1}
h1 span{color:var(--goal)}
.icons{display:flex;gap:6px}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ibtn{background:var(--tile);border:1px solid var(--tile-edge);color:var(--fg);border-radius:10px;height:38px;padding:0 12px;font-weight:600;font-size:.9rem}
.modes{display:flex;background:var(--tile);border:1px solid var(--tile-edge);border-radius:12px;padding:3px}
.modes button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;padding:8px;border-radius:9px;font-size:.95rem}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sub{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.sub b{color:var(--fg)}
.ladder{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;overflow-y:auto;padding:4px 0}
.row{display:flex;gap:6px;align-items:center;position:relative}
.row .lbl{position:absolute;left:-38px;font-size:.75rem;color:var(--muted);width:30px;text-align:right;font-variant-numeric:tabular-nums}
.t{width:52px;height:52px;display:grid;place-items:center;font-family:var(--display);font-size:1.7rem;text-transform:uppercase;
  background:var(--tile);border:2px solid var(--tile-edge);border-radius:8px;box-shadow:0 2px 0 var(--tile-edge);color:var(--fg)}
.t.match{background:var(--goal);border-color:var(--goal);color:var(--goal-fg);box-shadow:0 2px 0 color-mix(in srgb,var(--goal) 70%,#000)}
.t.changed{outline:3px solid var(--accent);outline-offset:-6px}
.row.start .t{border-color:var(--accent)}
.row.input .t{border-style:dashed}
.row.input .t.filled{border-style:solid;border-color:var(--fg)}
.row.target .t{background:var(--goal);border-color:var(--goal);color:var(--goal-fg);opacity:.55}
.row.target.reached .t{opacity:1}
.row.hint .t{border-color:var(--muted);color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop .t{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.shake,.pop .t{animation:none}}
.gap{color:var(--muted);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.msg{min-height:1.4em;text-align:center;font-weight:600;font-size:.95rem}
.msg.err{color:var(--warn)}
.controls{display:grid;justify-content:center;gap:8px;margin-bottom:16px}
.actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.kb{display:flex;flex-direction:column;gap:6px;padding-bottom:env(safe-area-inset-bottom,0px)}
.kr{display:flex;gap:5px;justify-content:center}
.k{flex:1;max-width:42px;height:52px;border:0;border-radius:7px;background:var(--key);color:var(--key-fg);font-weight:700;font-size:1.05rem;text-transform:uppercase;padding:0}
.k.wide{max-width:66px;flex:1.5;font-size:.8rem}
.k:active{filter:brightness(.9)}
.enter{height:52px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-size:1.4rem;letter-spacing:.06em;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.enter:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.enter:disabled{opacity:.4}
.panel{background:var(--tile);border:1px solid var(--tile-edge);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:var(--display);font-weight:400;margin:0;font-size:1.5rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:1.6rem;font-weight:400;font-variant-numeric:tabular-nums}
.stats span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;height:44px;font-weight:700;font-size:1rem;padding:0 18px}
.share{white-space:pre;font-size:.85rem;background:var(--bg);border-radius:8px;padding:8px;user-select:all;overflow-x:auto}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay .panel{max-width:400px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.2);max-height:85vh;overflow-y:auto}
.help p{margin:0;line-height:1.45}
.dist{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-variant-numeric:tabular-nums}
.dist div{display:flex;gap:6px;align-items:center}
.dist i{display:block;height:16px;background:var(--accent);border-radius:3px;min-width:4px}
.dist label{width:64px;color:var(--muted)}
.close{align-self:flex-end;background:none;border:0;color:var(--muted);font-size:1.4rem;line-height:1;padding:0}
@media (max-width:380px){.t{width:46px;height:46px;font-size:1.5rem}.k{height:48px}}
@media (max-height:740px){.app{gap:8px;padding-block:10px 8px}.t{width:46px;height:46px;font-size:1.5rem}.k{height:46px}.enter{height:46px}.controls{margin-bottom:20px}.ladder .gap{display:none}}
@media (max-height:600px){h1{font-size:1.5rem}.ibtn{height:32px}.modes button{padding:5px}.t{width:42px;height:42px;font-size:1.35rem}.k{height:40px}.enter{height:40px}}

<div class="app">
  <header>
    <h1>Loo <span>Ladder</span></h1>
    <div class="icons">
      <button class="ibtn" id="helpBtn" aria-label="How to play">?</button>
      <button class="ibtn" id="statsBtn">Stats</button>
    </div>
  </header>
  <div class="modes" role="group" aria-label="Mode">
    <button id="modeDaily" aria-pressed="true">Daily</button>
    <button id="modeFree" aria-pressed="false">Unlimited</button>
  </div>
  <div class="sub"><span id="puzzleLabel">Daily #1</span><span>Steps <b id="stepCount">0</b> · Par <b id="par">–</b></span></div>
  <div class="ladder" id="ladder" aria-live="polite"></div>
  <div class="msg" id="msg"></div>
  <div class="controls">
    <div class="actions">
      <button class="ibtn" id="undoBtn">Undo</button>
      <button class="ibtn" id="hintBtn">Hint</button>
      <button class="ibtn" id="giveBtn">Give up</button>
      <button class="ibtn" id="newBtn" hidden>New word</button>
    </div>
    <button class="enter" id="enterBtn">Enter</button>
  </div>
  <div class="kb" id="kb"></div>
</div>

<div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div>

const TARGET="poop";
const DICT=new Set(COMMON.split(/\s+/).filter(w=>/^[a-z]{4}$/.test(w)));
const VALID=new Set(DICT);
const A="abcdefghijklmnopqrstuvwxyz";

function neighbors(w,set){const out=[];for(let i=0;i<4;i++)for(const c of A){if(c===w[i])continue;const n=w.slice(0,i)+c+w.slice(i+1);if(set.has(n))out.push(n)}return out}
// distance from every common word to POOP (BFS over the common dictionary)
const DIST=new Map([[TARGET,0]]);
(function(){let q=[TARGET];while(q.length){const nq=[];for(const w of q)for(const n of neighbors(w,DICT))if(!DIST.has(n)){DIST.set(n,DIST.get(w)+1);nq.push(n)}q=nq}})();
const STARTS=[...DIST.entries()].filter(([w,d])=>d>=3&&d<=6&&!w.endsWith("s")).map(([w])=>w).sort();

// Try to load a larger dictionary so less-common real words are accepted as guesses
(async()=>{
  const add=arr=>{let n=0;for(const w of arr)if(typeof w==="string"&&/^[a-z]{4}$/.test(w)){VALID.add(w);n++}return n};
  const sources=[
    async()=>{const m=await import("https://cdn.jsdelivr.net/npm/an-array-of-english-words@2/+esm");return Object.values(m).find(Array.isArray)||[]},
    async()=>{const r=await fetch("https://cdn.jsdelivr.net/gh/dwyl/english-words@master/words_alpha.txt");if(!r.ok)throw new Error(r.status);return (await r.text()).split(/\r?\n/)}
  ];
  for(const load of sources){try{if(add(await load())>500)return}catch(e){}}
})();

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
const EPOCH=new Date(2026,9,18);
function dayNum(){const d=new Date();d.setHours(0,0,0,0);return Math.round((d-EPOCH)/864e5)+1}
function dailyStart(){return STARTS[hash("loo-"+today())%STARTS.length]}

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let mode="daily", S=null, typed="";
function freshState(start){return {start,steps:[],done:false,gaveUp:false,hints:0,date:today()}}
function loadDaily(){const s=store.get("loo-daily",null);if(s&&s.date===today())return s;return freshState(dailyStart())}
function save(){if(mode==="daily")store.set("loo-daily",S)}

const $=id=>document.getElementById(id);
const ladderEl=$("ladder"),msgEl=$("msg");
function cur(){return S.steps.length?S.steps[S.steps.length-1]:S.start}
function par(){return DIST.get(S.start)}

function tiles(word,prev,cls=""){
  const r=document.createElement("div");r.className="row "+cls;
  for(let i=0;i<4;i++){const t=document.createElement("div");t.className="t";const ch=word[i]||"";t.textContent=ch;
    if(ch&&cls!=="input"&&cls!=="target"&&ch===TARGET[i])t.classList.add("match");
    if(prev&&ch&&prev[i]!==ch&&cls!=="input")t.classList.add("changed");
    if(cls==="input"&&ch)t.classList.add("filled");
    r.appendChild(t)}
  return r}

function render(){
  ladderEl.innerHTML="";
  const st=tiles(S.start,null,"start");ladderEl.appendChild(st);
  let prev=S.start;
  S.steps.forEach((w,i)=>{const r=tiles(w,prev,i===S.steps.length-1?"pop":"");const l=document.createElement("span");l.className="lbl";l.textContent=i+1;r.appendChild(l);ladderEl.appendChild(r);prev=w});
  const reached=S.done&&!S.gaveUp;
  if(!S.done){ladderEl.appendChild(tiles(typed,null,"input"));
    const g=document.createElement("div");g.className="gap";const d=DIST.get(cur());g.textContent=d!=null?`·  ·  ·`:"·  ·  ·";ladderEl.appendChild(g)}
  if(!reached){const t=tiles(TARGET,null,"target");ladderEl.appendChild(t)}
  else ladderEl.lastChild.classList.add("reached");
  $("stepCount").textContent=S.steps.length;$("par").textContent=par()??"–";
  $("puzzleLabel").textContent=mode==="daily"?`Daily #${dayNum()} · ${today()}`:"Unlimited practice";
  $("undoBtn").disabled=S.done||!S.steps.length;$("hintBtn").disabled=S.done;$("giveBtn").disabled=S.done;const eb=$("enterBtn");if(eb)eb.disabled=S.done;
  $("newBtn").hidden=mode!=="free";
  ladderEl.scrollTop=ladderEl.scrollHeight;const inp=ladderEl.querySelector(".input");if(inp&&inp.getBoundingClientRect().top<ladderEl.getBoundingClientRect().top)inp.scrollIntoView({block:"end"});
}
function say(t,err){msgEl.textContent=t;msgEl.className="msg"+(err?" err":"")}
function shake(){const r=ladderEl.querySelector(".input");if(r){r.classList.remove("shake");void r.offsetWidth;r.classList.add("shake")}}

function submit(){
  if(S.done)return;
  const w=typed,p=cur();
  if(w.length<4){say("Type a full 4-letter word.",1);shake();return}
  let diff=0;for(let i=0;i<4;i++)if(w[i]!==p[i])diff++;
  if(diff!==1){say(`Change exactly one letter of ${p.toUpperCase()}.`,1);shake();return}
  if(!VALID.has(w)){say(`${w.toUpperCase()} isn't in the word list.`,1);shake();return}
  if(w===S.start||S.steps.includes(w)){say(`You already used ${w.toUpperCase()}.`,1);shake();return}
  S.steps.push(w);typed="";
  if(w===TARGET){S.done=true;finish()}else say("");
  save();render();
}
function finish(){
  const n=S.steps.length,p=par();
  say(n<=p?(n<p?"Under par. Impressive flush.":"Right on par. Clean finish."):`Made it in ${n}. Par was ${p}.`);
  if(mode==="daily")recordStats(true);
  setTimeout(showResult,600);
}
function recordStats(win){
  const st=store.get("loo-stats",{played:0,wins:0,streak:0,best:0,last:null,dist:{}});
  if(st.last===today())return;
  const y=new Date();y.setDate(y.getDate()-1);const yk=`${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,"0")}-${String(y.getDate()).padStart(2,"0")}`;
  st.played++;
  if(win){st.wins++;st.streak=st.last===yk&&st.lastWin?st.streak+1:1;st.best=Math.max(st.best,st.streak);
    const over=Math.min(S.steps.length-par(),4);const key=over<=0?(over<0?"under":"par"):over>=4?"+4":"+"+over;st.dist[key]=(st.dist[key]||0)+1}
  else st.streak=0;
  st.last=today();st.lastWin=win;store.set("loo-stats",st)
}
function siteUrl(){return /^https?:$/.test(location.protocol)?location.origin+location.pathname:""}
function shareText(){
  const rows=S.steps.map(w=>[...w].map((c,i)=>c===TARGET[i]?"🟫":"⬜").join(""));
  const head=mode==="daily"?`Loo Ladder #${dayNum()}`:"Loo Ladder (practice)";
  const res=S.gaveUp?"gave up 🧻":`${S.steps.length} steps · par ${par()}${S.hints?` · ${S.hints} hint${S.hints>1?"s":""}`:""}`;
  const u=siteUrl();
  return `${head} — ${res}\n${rows.join("\n")}${S.gaveUp?"":" 💩"}${u?"\n"+u:""}`
}
function showResult(){
  const p=$("panel");
  p.innerHTML=`<button class="close" aria-label="Close" data-close>×</button>
  <h2>${S.gaveUp?"Down the drain":"You reached POOP"}</h2>
  <p style="margin:0;color:var(--muted)">${S.gaveUp?"One shortest route:":`${S.start.toUpperCase()} → POOP in ${S.steps.length} steps. Par was ${par()}.`}</p>
  ${S.gaveUp?`<p style="margin:0;font-weight:700;letter-spacing:.05em">${solve(S.start).map(w=>w.toUpperCase()).join(" → ")}</p>`:""}
  <div class="share" id="shareBox">${shareText()}</div>
  <div class="btnrow"><button class="primary" id="shareBtn"${navigator.share?"":" hidden"}>Share result</button><button class="${navigator.share?"ibtn":"primary"}" id="copyBtn">Copy result</button></div>
  ${mode==="free"?`<button class="ibtn" id="againBtn">Play another</button>`:`<p style="margin:0;color:var(--muted);font-size:.9rem">A new daily ladder arrives at midnight. Unlimited mode is open anytime.</p>`}`;
  $("overlay").hidden=false;
  $("copyBtn").onclick=()=>{const t=shareText();navigator.clipboard.writeText(t).then(()=>{$("copyBtn").textContent="Copied"}).catch(()=>{const r=document.createRange();r.selectNodeContents($("shareBox"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("copyBtn").textContent="Selected, press copy"})};
  $("shareBtn").onclick=async()=>{try{await navigator.share({text:shareText()})}catch(e){}};
  const a=$("againBtn");if(a)a.onclick=()=>{close();newFree()};
}
function solve(from){
  let w=from,path=[];
  if(!DIST.has(w)){const n=neighbors(w,DICT).filter(x=>DIST.has(x)).sort((a,b)=>DIST.get(a)-DIST.get(b))[0];if(!n)return [];w=n;path.push(w)}
  while(w!==TARGET){w=neighbors(w,DICT).find(n=>DIST.get(n)===DIST.get(w)-1);path.push(w)}
  return path
}
function hint(){
  if(S.done)return;const p=cur();
  const opts=neighbors(p,DICT).filter(n=>DIST.has(n)&&!S.steps.includes(n)&&n!==S.start).sort((a,b)=>DIST.get(a)-DIST.get(b));
  if(!opts.length){say("No hint from this word. Try Undo.",1);return}
  S.hints++;typed=opts[0];save();render();say(`Try ${opts[0].toUpperCase()} (${DIST.get(opts[0])} more to go after it). Press Enter.`)
}
function giveUp(){
  if(S.done)return;
  if($("giveBtn").dataset.arm!=="1"){$("giveBtn").dataset.arm="1";$("giveBtn").textContent="Tap again";setTimeout(()=>{$("giveBtn").dataset.arm="";$("giveBtn").textContent="Give up"},2500);return}
  $("giveBtn").dataset.arm="";$("giveBtn").textContent="Give up";
  S.done=true;S.gaveUp=true;if(mode==="daily")recordStats(false);save();render();say("");showResult()
}
function undo(){if(S.done||!S.steps.length)return;S.steps.pop();typed="";save();render();say("")}
function newFree(){let s;do{s=STARTS[Math.floor(Math.random()*STARTS.length)]}while(S&&s===S.start);S=freshState(s);typed="";render();say("")}
function setMode(m){mode=m;$("modeDaily").setAttribute("aria-pressed",m==="daily");$("modeFree").setAttribute("aria-pressed",m==="free");
  typed="";if(m==="daily")S=loadDaily();else newFree();render();say(m==="daily"&&S.done?"You've finished today's ladder.":"")}

function key(k){
  if(S.done)return;
  if(k==="enter")return submit();
  if(k==="back"){typed=typed.slice(0,-1)}
  else if(/^[a-z]$/.test(k)&&typed.length<4)typed+=k;
  say("");render()
}
// keyboard
const KR=["qwertyuiop","asdfghjkl","zxcvbnm"];
KR.forEach((r,i)=>{const row=document.createElement("div");row.className="kr";
  for(const c of r){const b=document.createElement("button");b.className="k";b.textContent=c;b.onclick=()=>key(c);row.appendChild(b)}
  if(i===2){const b=document.createElement("button");b.className="k wide";b.textContent="⌫";b.setAttribute("aria-label","Delete");b.onclick=()=>key("back");row.appendChild(b)}
  $("kb").appendChild(row)});
document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(!$("overlay").hidden){if(e.key==="Escape")close();return}
  if(e.key==="Enter"){e.preventDefault();key("enter")}else if(e.key==="Backspace")key("back");else if(/^[a-zA-Z]$/.test(e.key))key(e.key.toLowerCase())});

function close(){$("overlay").hidden=true}
$("overlay").addEventListener("click",e=>{if(e.target.id==="overlay"||e.target.dataset.close!==undefined)close()});
$("enterBtn").onclick=()=>key("enter");$("undoBtn").onclick=undo;$("hintBtn").onclick=hint;$("giveBtn").onclick=giveUp;$("newBtn").onclick=newFree;
$("modeDaily").onclick=()=>setMode("daily");$("modeFree").onclick=()=>setMode("free");
$("helpBtn").onclick=()=>{$("panel").innerHTML=`<button class="close" aria-label="Close" data-close>×</button><div class="help panel" style="border:0;padding:0">
  <h2>How to play</h2>
  <p>Start from the top word and climb down to <b>POOP</b>.</p>
  <p>Each step changes exactly one letter, and every step has to be a real 4-letter word. Example: COOL → POOL → POOP.</p>
  <p>Brown tiles are letters already in the right spot. The ringed tile is the letter you just changed.</p>
  <p><b>Par</b> is the shortest possible ladder. Match it or beat it.</p>
  <p><b>Daily</b> gives everyone the same word each day and tracks your streak. <b>Unlimited</b> is endless practice and never touches your stats.</p></div>`;$("overlay").hidden=false};
$("statsBtn").onclick=()=>{const st=store.get("loo-stats",{played:0,wins:0,streak:0,best:0,dist:{}});
  const keys=["under","par","+1","+2","+3","+4"],labels={under:"Under par",par:"On par","+1":"+1","+2":"+2","+3":"+3","+4":"+4 or more"};
  const mx=Math.max(1,...keys.map(k=>st.dist[k]||0));
  $("panel").innerHTML=`<button class="close" aria-label="Close" data-close>×</button><h2>Your stats</h2>
  <div class="stats"><div><b>${st.played}</b><span>Played</span></div><div><b>${st.played?Math.round(st.wins/st.played*100):0}%</b><span>Solved</span></div><div><b>${st.streak}</b><span>Streak</span></div><div><b>${st.best}</b><span>Best</span></div></div>
  <div class="dist">${keys.map(k=>`<div><label>${labels[k]}</label><i style="width:${(st.dist[k]||0)/mx*70}%"></i><span>${st.dist[k]||0}</span></div>`).join("")}</div>
  <p style="margin:0;color:var(--muted);font-size:.85rem">Stats are saved in this browser only.</p>`;$("overlay").hidden=false};

S=loadDaily();render();
if(S.done)say("You've finished today's ladder. Try Unlimited for more.");
else if(!store.get("loo-seen",false)){store.set("loo-seen",true);$("helpBtn").click()}
</script>
</body>
</html>
